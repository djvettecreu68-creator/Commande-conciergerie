              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M3,11 C3,6 7,3 12,3 C17,3 21,6 21,11 Z M2,13 L22,13 L22,15 L2,15 Z M3,17 L21,17 L21,19 Q21,21 19,21 L5,21 Q3,21 3,19 Z" />
