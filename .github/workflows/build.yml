          cat > 'app/src/main/java/fr/hack68/conciergerie/MajRetour.java' <<'CC_EOF_14'
          package fr.hack68.conciergerie;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;

          /** Réponse d’Android pendant l’installation de la mise à jour. */
          public class MajRetour extends BroadcastReceiver {
              @Override
              @SuppressWarnings("deprecation")
              public void onReceive(Context c, Intent i) {
                  int st = i.getIntExtra(PackageInstaller.EXTRA_STATUS, -999);
                  if (st == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent conf = i.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (conf != null) {
                          conf.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          c.startActivity(conf);
                      }
                  } else if (st != PackageInstaller.STATUS_SUCCESS) {
                      Maj.etat("Installation non faite : " + i.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE), true);
                  }
              }
          }
