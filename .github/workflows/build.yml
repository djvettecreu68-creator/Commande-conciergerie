name: Construire l'APK Conciergerie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname "settings.gradle")"
          cat > 'settings.gradle' <<'CC_EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Conciergerie"
          include ':app'
          CC_EOF_0
          mkdir -p "$(dirname "build.gradle")"
          cat > 'build.gradle' <<'CC_EOF_1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          CC_EOF_1
          mkdir -p "$(dirname "gradle.properties")"
          cat > 'gradle.properties' <<'CC_EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          CC_EOF_2
          mkdir -p "$(dirname "app/build.gradle")"
          cat > 'app/build.gradle' <<'CC_EOF_3'
          plugins { id 'com.android.application' }

          def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

          android {
              namespace 'fr.hack68.conciergerie'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.hack68.conciergerie'
                  minSdk 26
                  targetSdk 34
                  versionCode numero
                  versionName "1.${numero}"
              }
              signingConfigs {
                  cle {
                      storeFile file('conciergerie.keystore')
                      storePassword 'conciergerie'
                      keyAlias 'conciergerie'
                      keyPassword 'conciergerie'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.cle }
                  release { signingConfig signingConfigs.cle; minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          CC_EOF_3
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'CC_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:label="Conciergerie"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".Ecoute"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Alerte la conciergerie des nouvelles commandes" />
                  </service>
                  <service
                      android:name=".Attente"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Prévient le collègue quand sa commande est prête" />
                  </service>
                  <receiver android:name=".MajRetour" android:exported="false" />
                  <receiver android:name=".Demarrage" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          CC_EOF_4
          mkdir -p "$(dirname "app/src/main/res/values/colors.xml")"
          cat > 'app/src/main/res/values/colors.xml' <<'CC_EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fond_icone">#0B6E70</color>
          </resources>
          CC_EOF_5
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_avant.xml")"
          cat > 'app/src/main/res/drawable/ic_avant.xml' <<'CC_EOF_6'
