          mkdir -p "$(dirname "app/src/main/res/drawable/ic_notif.xml")"
          cat > 'app/src/main/res/drawable/ic_notif.xml' <<'CC_EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
