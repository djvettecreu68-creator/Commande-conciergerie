          mkdir -p "$(dirname "app/src/main/java/fr/hack68/conciergerie/Attente.java")"
          cat > 'app/src/main/java/fr/hack68/conciergerie/Attente.java' <<'CC_EOF_9'
          package fr.hack68.conciergerie;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONObject;

          /** Côté collègue : tant qu’une commande est en préparation, regarde toutes les 20 s si elle est prête. */
          public class Attente extends Service {
              static final String FOND = "attente_fond", PRETE = "prete";
              static final long MAX = 12L * 3600 * 1000;
              volatile boolean actif;
              volatile int restant;
              Thread fil;

              @Override
              public IBinder onBind(Intent i) { return null; }

              SharedPreferences prefs() { return getSharedPreferences("attente", MODE_PRIVATE); }

              @Override
              public int onStartCommand(Intent i, int flags, int id) {
                  if (i != null && i.hasExtra("n")) prefs().edit().putInt("n", i.getIntExtra("n", 1)).apply();
                  restant = prefs().getInt("n", 0);
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(FOND, "Commande en préparation", NotificationManager.IMPORTANCE_MIN));
                  NotificationChannel ch = new NotificationChannel(PRETE, "Commande prête", NotificationManager.IMPORTANCE_HIGH);
                  ch.enableVibration(true);
                  nm.createNotificationChannel(ch);
                  Notification n = new Notification.Builder(this, FOND)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle("Commande en préparation")
                          .setContentText("Tu seras prévenu quand elle sera prête.")
                          .setContentIntent(ouvrir())
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(2, n);
                  if (restant <= 0) { stopSelf(); return START_NOT_STICKY; }
                  if (fil == null || !fil.isAlive()) {
                      actif = true;
                      fil = new Thread(this::boucle);
                      fil.start();
                  }
                  return START_STICKY;
              }

              PendingIntent ouvrir() {
                  Intent i = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(this, 1, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              void boucle() {
                  long vu = -1, debut = System.currentTimeMillis();
                  int num = 100;
                  while (actif && System.currentTimeMillis() - debut < MAX) {
                      String jeton = prefs().getString("jeton", null);
                      if (jeton == null) break;
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(MainActivity.BASE + "/api/mes-validees").openConnection();
                          c.setRequestProperty("X-Jeton", jeton);
                          c.setConnectTimeout(10000);
                          c.setReadTimeout(10000);
                          int code = c.getResponseCode();
                          if (code == 401 || code == 403) break;
                          if (code == 200) {
                              JSONObject d = new JSONObject(Ecoute.lire(c.getInputStream()));
                              long n = d.optLong("n");
                              if (vu >= 0 && n > vu) {
                                  notifier(num++, d.optString("txt"), d.optBoolean("annule"));
                                  restant -= (int) (n - vu);
                                  prefs().edit().putInt("n", Math.max(restant, 0)).apply();
                                  if (restant <= 0) break;
                              }
                              vu = n;
                          }
                          c.disconnect();
                      } catch (Exception ignore) { }
                      try { Thread.sleep(20000); } catch (InterruptedException e) { break; }
                  }
                  stopSelf();
              }

              void notifier(int id, String txt, boolean annule) {
                  Notification n = new Notification.Builder(this, PRETE)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle(annule ? "Commande annulée par la conciergerie" : "✅ Ta commande est prête")
                          .setContentText(txt)
                          .setContentIntent(ouvrir())
                          .setAutoCancel(true)
                          .build();
                  getSystemService(NotificationManager.class).notify(id, n);
              }

              @Override
              public void onDestroy() {
                  actif = false;
                  if (fil != null) fil.interrupt();
                  super.onDestroy();
              }
          }
          CC_EOF_9
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/conciergerie/Demarrage.java")"
          cat > 'app/src/main/java/fr/hack68/conciergerie/Demarrage.java' <<'CC_EOF_10'
          package fr.hack68.conciergerie;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Après un redémarrage du téléphone, la Conciergerie reste à l’écoute des commandes. */
          public class Demarrage extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())
                          && c.getSharedPreferences("conc", Context.MODE_PRIVATE).getString("jeton", null) != null) {
                      try { c.startForegroundService(new Intent(c, Ecoute.class)); } catch (Exception ignore) { }
                  }
              }
          }
          CC_EOF_10
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/conciergerie/Ecoute.java")"
          cat > 'app/src/main/java/fr/hack68/conciergerie/Ecoute.java' <<'CC_EOF_11'
          package fr.hack68.conciergerie;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONObject;

          /** Côté Conciergerie : regarde toutes les 20 s s’il y a une nouvelle commande et sonne. */
          public class Ecoute extends Service {
              static final String FOND = "fond", CMD = "commandes";
              volatile boolean actif;
              Thread fil;

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent i, int flags, int id) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(FOND, "Écoute des commandes", NotificationManager.IMPORTANCE_MIN));
                  NotificationChannel ch = new NotificationChannel(CMD, "Nouvelles commandes", NotificationManager.IMPORTANCE_HIGH);
                  ch.enableVibration(true);
                  nm.createNotificationChannel(ch);
                  Notification n = new Notification.Builder(this, FOND)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle("Conciergerie")
                          .setContentText("À l’écoute des nouvelles commandes")
                          .setContentIntent(ouvrir())
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(1, n);
                  if (fil == null || !fil.isAlive()) {
                      actif = true;
                      fil = new Thread(this::boucle);
                      fil.start();
                  }
                  return START_STICKY;
              }

              PendingIntent ouvrir() {
                  Intent i = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              void boucle() {
                  long vu = -1;
                  int num = 10;
                  while (actif) {
                      String jeton = getSharedPreferences("conc", MODE_PRIVATE).getString("jeton", null);
                      if (jeton == null) break;
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(MainActivity.BASE + "/api/dernier").openConnection();
                          c.setRequestProperty("X-Jeton", jeton);
                          c.setConnectTimeout(10000);
                          c.setReadTimeout(10000);
                          int code = c.getResponseCode();
                          if (code == 401 || code == 403) {
                              getSharedPreferences("conc", MODE_PRIVATE).edit().remove("jeton").apply();
                              break;
                          }
                          if (code == 200) {
                              JSONObject d = new JSONObject(lire(c.getInputStream()));
                              long t = d.optLong("t");
                              String txt = d.optString("txt");
                              if (vu >= 0 && t != vu && !txt.isEmpty()) notifier(num++, txt);
                              vu = t;
                          }
                          c.disconnect();
                      } catch (Exception ignore) { }
                      try { Thread.sleep(20000); } catch (InterruptedException e) { break; }
                  }
                  stopSelf();
              }

              void notifier(int id, String txt) {
                  Notification n = new Notification.Builder(this, CMD)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle("🥪 Nouvelle commande")
                          .setContentText(txt)
                          .setContentIntent(ouvrir())
                          .setAutoCancel(true)
                          .build();
                  getSystemService(NotificationManager.class).notify(id, n);
              }

              @Override
              public void onDestroy() {
                  actif = false;
                  if (fil != null) fil.interrupt();
                  super.onDestroy();
              }

              static String lire(InputStream in) throws IOException {
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] x = new byte[4096];
                  int n;
                  while ((n = in.read(x)) > 0) b.write(x, 0, n);
                  in.close();
                  return b.toString("UTF-8");
              }
          }
          CC_EOF_11
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/conciergerie/MainActivity.java")"
          cat > 'app/src/main/java/fr/hack68/conciergerie/MainActivity.java' <<'CC_EOF_12'
          package fr.hack68.conciergerie;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /** L’appli affiche le site du Worker ; le téléphone ajoute les alertes et la mise à jour. */
          public class MainActivity extends Activity {
              static final String BASE = "https://commande-conciergerie.djvettecreu68.workers.dev";
              static MainActivity ici;
              WebView w;

              static final String HORS_LIGNE = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                      + "<body style='font-family:sans-serif;padding:32px;text-align:center'><h2>Pas de connexion</h2>"
                      + "<p>Vérifie le Wi-Fi ou les données mobiles.</p>"
                      + "<button style='font-size:18px;padding:14px 24px;border:0;border-radius:12px;background:#0B6E70;color:#fff' "
                      + "onclick='Android.recharger()'>Réessayer</button></body></html>";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  ici = this;
                  getWindow().setStatusBarColor(Color.parseColor("#0B6E70"));
                  w = new WebView(this);
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  w.addJavascriptInterface(new Pont(), "Android");
                  w.setWebChromeClient(new WebChromeClient());
                  w.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          if (r.getUrl().toString().startsWith(BASE)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception ignore) { }
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) v.loadDataWithBaseURL(null, HORS_LIGNE, "text/html", "utf-8", null);
                      }
                  });
                  charger();
              }

              void charger() { w.loadUrl(BASE + "/?app=" + version()); }

              @SuppressWarnings("deprecation")
              int version() {
                  try { return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode; }
                  catch (Exception e) { return 0; }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (w != null && w.canGoBack()) w.goBack(); else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (ici == this) ici = null;
                  super.onDestroy();
              }

              /** Exécute du JavaScript dans la page (depuis n’importe quel fil). */
              static void js(String code) {
                  MainActivity a = ici;
                  if (a != null) a.runOnUiThread(() -> { if (a.w != null) a.w.evaluateJavascript(code, null); });
              }

              class Pont {
                  @JavascriptInterface
                  public int version() { return MainActivity.this.version(); }

                  @JavascriptInterface
                  public void ecoute(String jeton) {
                      getSharedPreferences("conc", MODE_PRIVATE).edit().putString("jeton", jeton).apply();
                      runOnUiThread(() -> {
                          if (Build.VERSION.SDK_INT >= 33
                                  && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED)
                              requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                          try { startForegroundService(new Intent(MainActivity.this, Ecoute.class)); } catch (Exception ignore) { }
                      });
                  }

                  @JavascriptInterface
                  public void arret() {
                      getSharedPreferences("conc", MODE_PRIVATE).edit().remove("jeton").apply();
                      getSharedPreferences("attente", MODE_PRIVATE).edit().clear().apply();
                      stopService(new Intent(MainActivity.this, Ecoute.class));
                      stopService(new Intent(MainActivity.this, Attente.class));
                  }

                  @JavascriptInterface
                  public void attente(String jeton, int n) {
                      getSharedPreferences("attente", MODE_PRIVATE).edit().putString("jeton", jeton).apply();
                      runOnUiThread(() -> {
                          if (Build.VERSION.SDK_INT >= 33
                                  && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED)
                              requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2);
                          try { startForegroundService(new Intent(MainActivity.this, Attente.class).putExtra("n", n)); } catch (Exception ignore) { }
                      });
                  }

                  @JavascriptInterface
                  public void majApk() { new Thread(() -> Maj.lancer(MainActivity.this)).start(); }

                  @JavascriptInterface
                  public void recharger() { runOnUiThread(MainActivity.this::charger); }
              }
          }
          CC_EOF_12
          mkdir -p "$(dirname "app/src/main/java/fr/hack68/conciergerie/Maj.java")"
          cat > 'app/src/main/java/fr/hack68/conciergerie/Maj.java' <<'CC_EOF_13'
          package fr.hack68.conciergerie;

          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONObject;

          /** Mise à jour obligatoire : télécharge la nouvelle APK depuis le Worker et l’installe. */
          public class Maj {
              static void etat(String t, boolean fini) {
                  MainActivity.js("majEtat(" + JSONObject.quote(t) + "," + fini + ")");
              }

              static void lancer(MainActivity a) {
                  try {
                      if (!a.getPackageManager().canRequestPackageInstalls()) {
                          a.runOnUiThread(() -> a.startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:" + a.getPackageName()))));
                          etat("Autorise l’installation pour Conciergerie, reviens ici, puis appuie à nouveau sur « Mettre à jour ».", true);
                          return;
                      }
                      File f = new File(a.getCacheDir(), "maj.apk");
                      HttpURLConnection c = (HttpURLConnection) new URL(MainActivity.BASE + "/apk").openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(60000);
                      if (c.getResponseCode() != 200) throw new Exception("téléchargement impossible (" + c.getResponseCode() + ")");
                      long total = c.getContentLengthLong(), lu = 0;
                      int dernier = -1;
                      try (InputStream in = c.getInputStream(); OutputStream o = new FileOutputStream(f)) {
                          byte[] b = new byte[65536];
                          int n;
                          while ((n = in.read(b)) > 0) {
                              o.write(b, 0, n);
                              lu += n;
                              if (total > 0) {
                                  int p = (int) (lu * 100 / total);
                                  if (p / 10 != dernier) { dernier = p / 10; etat("Téléchargement… " + p + " %", false); }
                              }
                          }
                      }
                      PackageInstaller pi = a.getPackageManager().getPackageInstaller();
                      int id = pi.createSession(new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL));
                      try (PackageInstaller.Session s = pi.openSession(id)) {
                          try (OutputStream o = s.openWrite("maj", 0, f.length()); InputStream in = new FileInputStream(f)) {
                              byte[] b = new byte[65536];
                              int n;
                              while ((n = in.read(b)) > 0) o.write(b, 0, n);
                              s.fsync(o);
                          }
                          int fl = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0);
                          PendingIntent pend = PendingIntent.getBroadcast(a, 7, new Intent(a, MajRetour.class), fl);
                          s.commit(pend.getIntentSender());
