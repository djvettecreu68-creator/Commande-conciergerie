              <path android:fillColor="#E8735A" android:pathData="M34,61 L74,61 L74,65 L34,65 Z" />
              <path android:fillColor="#FFE0A3" android:pathData="M34,67 L74,67 L74,70 Q74,74 70,74 L38,74 Q34,74 34,70 Z" />
